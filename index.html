<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUL - مرحباً بكم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            direction: rtl;
            font-family: 'Arial', sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        header {
            background-color: #0d1117;
            padding: 15px 0;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid #21262d;
        }
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 90%;
            margin: 0 auto;
        }
        .logo {
            font-size: 2.2em;
            font-weight: bold;
            background: linear-gradient(to right, #d8b4fe, #9333ea);
            -webkit-background-clip: text;
            color: transparent;
            margin: 0;
        }
        main {
            padding-top: 90px;
            padding-bottom: 40px;
        }
        .hero {
            text-align: center;
            margin-bottom: 30px;
            padding: 0 5%;
        }
        .hero-image {
            display: inline-block;
            margin-bottom: 15px;
            max-width: 100%;
        }
        @keyframes spaceFloat {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .hero-image img {
            width: 210px;
            height: 210px;
            object-fit: cover;
            border-radius: 30px;
            border: 3px solid #c084fc;
            box-shadow: 0 6px 25px rgba(147, 51, 234, 0.5);
            display: block;
            margin: 0 auto;
            animation: spaceFloat 4s ease-in-out infinite;
        }
        .welcome-text {
            font-size: 1.6em;
            font-weight: bold;
            background: linear-gradient(to right, #c084fc, #d8b4fe);
            -webkit-background-clip: text;
            color: transparent;
            margin: 15px 0 0 0;
        }
        .services {
            display: flex;
            justify-content: center;
            padding: 0 5%;
            width: 100%;
        }
        .service-card {
            background-color: #1a1528;
            border: 2px solid;
            border-image: linear-gradient(to bottom, #c084fc, #7e22ce) 1;
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 12px rgba(126, 34, 206, 0.25);
        }
        .card-icon i {
            font-size: 3em;
            margin-bottom: 10px;
            background: linear-gradient(to right, #c084fc, #a855f7);
            -webkit-background-clip: text;
            color: transparent;
        }
        .service-card h3 { font-size: 1.5em; margin: 0 0 8px 0; color: #ffffff; }
        .service-card p { font-size: 1em; margin: 0 0 20px 0; color: #d8b4fe; }
        
        /* زر الدخول لصفحة السكربتات */
        .card-button {
            display: inline-block;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1em;
            color: #ffffff;
            background: linear-gradient(to right, #a855f7, #7e22ce);
            box-shadow: 0 2px 6px rgba(168, 85, 247, 0.4);
            transition: transform 0.2s;
        }
        .card-button:hover { transform: scale(1.05); }
        footer {
            background-color: #0d1117;
            padding: 20px 0;
            text-align: center;
            color: #8b949e;
            font-size: 0.9em;
            border-top: 1px solid #21262d;
            margin-top: 50px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1 class="logo">RUL</h1>
        </div>
    </header>
    
    <main>
        <section class="hero">
            <div class="hero-image">
                <img src="logo.png?v=3" alt="RUL Logo">
            </div>
            <h2 class="welcome-text">مرحباً بكم في موقع RUL</h2>
        </section>
        
        <section class="services">
            <!-- بطاقة سكربتات فقط -->
            <div class="service-card">
                <div class="card-icon">
                    <i class="fas fa-code"></i>
                </div>
                <h3>مكتبة السكربتات</h3>
                <p>اضغط للدخول والبحث عن المابات</p>
                
                <!-- 🌟 هنا الرابط المهم اللي ينقلك للصفحة الثانية 🌟 -->
                <a href="scripts.html" class="card-button">دخول للمكتبة <i class="fas fa-chevron-left"></i></a>
            </div>
        </section>
    </main>

    <footer>
        <p>جميع الحقوق محفوظة © 2026 RUL</p>
    </footer>
</body>
</html>
